name: Build ISRAFIL APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q ISRAFIL_Launcher_Source.zip -d extracted

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd extracted/ISRAFIL_Launcher
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ISRAFIL-APK
          path: extracted/ISRAFIL_Launcher/app/build/outputs/apk/debug/app-debug.apk
